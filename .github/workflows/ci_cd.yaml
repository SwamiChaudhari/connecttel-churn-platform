name: ConnectTel Churn Platform CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data generation
        run: python src/data/generate_dataset.py

      - name: Run data cleaning
        run: python src/data/data_cleaning.py

      - name: Run feature engineering
        run: python src/features/feature_engineering.py

      - name: Run ML pipeline
        run: python src/models/ml_pipeline.py

      - name: Run model evaluation
        run: python src/models/model_evaluation.py

      - name: Run SHAP analysis
        run: python src/models/shap_analysis.py

      - name: Run retention engine
        run: python src/models/retention_engine.py

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v || true

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ matrix.python-version }}
          path: models/

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t connecttel-churn -f deployment/Dockerfile .

      - name: Test Docker image
        run: |
          docker run -d -p 8501:8501 --name churn-test connecttel-churn
          sleep 15
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop churn-test
