# ============================================================
# ConnectTel Churn Platform — Docker Compose
# ============================================================
version: "3.8"

services:
  churn-dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - STREAMLIT_SERVER_PORT=8501
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: API service (fastapi can be added later)
  # churn-api:
  #   build:
  #     context: ..
  #     dockerfile: deployment/Dockerfile.api
  #   ports:
  #     - "8000:8000"
