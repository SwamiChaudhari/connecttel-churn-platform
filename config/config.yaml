dataset:
  raw: "data/connecttel_churn_raw.csv"
  clean: "data/connecttel_churn_clean.csv"
  engineered: "data/connecttel_churn_engineered.csv"
  train: "data/train.csv"
  test: "data/test.csv"
  sample_size: 10476
  target_column: "Churn"

project:
  name: "connecttel-churn-platform"
  version: "1.0.0"
  author: "Data Science Team"
  random_seed: 42
  description: "Customer Churn Prediction & Retention Intelligence Platform"

features:
  demographic: ["gender", "SeniorCitizen", "Partner", "Dependents"]
  account: ["tenure", "Contract", "PaperlessBilling", "PaymentMethod"]
  services: ["PhoneService", "MultipleLines", "InternetService",
             "OnlineSecurity", "OnlineBackup", "DeviceProtection",
             "TechSupport", "StreamingTV", "StreamingMovies"]
  charges: ["MonthlyCharges", "TotalCharges"]
  engineered:
    - "avg_monthly_charge"
    - "charge_tenure_ratio"
    - "customer_lifetime_value"
    - "engagement_score"
    - "service_utilization_score"
    - "contract_risk_score"
    - "loyalty_score"
    - "churn_risk_index"
    - "tenure_group"
    - "is_new_customer"

models:
  logistic_regression:
    params:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 1000
    tune_params:
      C: [0.01, 0.1, 1.0, 10.0, 100.0]
      penalty: ["l2"]

  random_forest:
    params:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
    tune_params:
      n_estimators: [100, 200, 300]
      max_depth: [5, 10, 15, 20]
      min_samples_split: [2, 5, 10]

  xgboost:
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: "logloss"
      use_label_encoder: false
    tune_params:
      n_estimators: [100, 200, 300, 500]
      max_depth: [3, 5, 7, 9]
      learning_rate: [0.01, 0.05, 0.1, 0.2]
      subsample: [0.7, 0.8, 0.9]

  lightgbm:
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      verbose: -1
    tune_params:
      n_estimators: [100, 200, 300, 500]
      max_depth: [3, 5, 7]
      num_leaves: [15, 31, 63]
      learning_rate: [0.01, 0.05, 0.1]

  catboost:
    params:
      iterations: 200
      depth: 6
      learning_rate: 0.1
      verbose: 0
    tune_params:
      iterations: [100, 200, 500]
      depth: [4, 6, 8]
      learning_rate: [0.01, 0.05, 0.1]

training:
  test_size: 0.2
  validation_size: 0.1
  cv_folds: 5
  scoring: "roc_auc"
  stratified: true

dashboard:
  title: "ConnectTel Churn Intelligence"
  theme: "dark"
  default_page: "Executive Overview"
  pages:
    - "Executive Overview"
    - "Churn Analytics"
    - "Revenue Analytics"
    - "Customer Segmentation"
    - "AI Prediction Center"
    - "Retention Recommendations"
    - "Model Monitoring"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/connecttel_churn.log"
  max_size: 10485760  # 10MB
  backup_count: 5

mlops:
  model_registry_dir: "models/"
  monitoring_dir: "logs/monitoring/"
  retrain_threshold_drift: 0.05
  alert_email: "datascience@connecttel.com"
